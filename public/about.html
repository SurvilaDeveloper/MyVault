<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About MyVault</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #020617;
            --panel: #111827;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #60a5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #020617, #0f172a);
            color: var(--text);
            font-family: Inter, system-ui, Arial, sans-serif;
        }

        .card {
            width: min(92vw, 460px);
            background: rgba(17, 24, 39, 0.94);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.32);
        }

        img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.7rem;
        }

        p {
            margin: 8px 0;
        }

        .muted {
            color: var(--muted);
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <section class="card">
        <img src="./myvault.png" alt="MyVault" />
        <h1>MyVault</h1>
        <p class="muted">Gestor local y privado de contraseñas y notas.</p>
        <p>Desarrollado por Gabriel Survila</p>
        <p class="muted">© 2026</p>
    </section>
</body>

</html>
